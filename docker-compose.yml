version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./application/config/testing/database.php:/var/www/html/application/config/testing/database.php:ro
    environment:
      - ENVIRONMENT=testing
      - APACHE_RUN_USER=#${UID:-1000}
      - APACHE_RUN_GROUP=#${GID:-1000}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: upchar_live
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  db_data: