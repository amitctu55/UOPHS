name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: upchar_live
          MYSQL_USER: root
          MYSQL_PASSWORD: ""
          MYSQL_ROOT_PASSWORD: ""
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, pdo_mysql, zip, bcmath, gd
        ini-values: error_reporting=E_ALL
        tools: composer

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Copy environment files
      run: |
        cp application/config/testing/database.php.example application/config/testing/database.php 2>/dev/null || true
        cp application/config/database.php.example application/config/database.php 2>/dev/null || true

    - name: Set file permissions
      run: |
        chmod -R 755 .
        chmod -R 777 application/cache application/logs temp2

    - name: Run basic PHP syntax check
      run: find . -name "*.php" -exec php -l {} \; | grep -v "No syntax errors detected"

    - name: Test database connection
      run: |
        php -r "
        \$mysqli = new mysqli('localhost', 'root', '', 'upchar_live');
        if (\$mysqli->connect_error) {
            echo 'Connection failed: ' . \$mysqli->connect_error;
            exit(1);
        }
        echo 'Database connection successful';
        \$mysqli->close();
        "