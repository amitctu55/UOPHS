name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: upchar_live
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, pdo_mysql, zip, bcmath, gd
        ini-values: error_reporting=E_ALL
        tools: composer

    - name: Wait for MySQL to be ready
      env:
        MYSQL_PWD: ""
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h127.0.0.1 -P3306 --silent; then
            # Additional check: try to connect to the database
            if mysql -h127.0.0.1 -P3306 -uroot -e "SHOW DATABASES;" | grep -q upchar_live; then
              echo "MySQL is ready and database exists!"
              break
            fi
          fi
          echo "Waiting for MySQL connection... ($i/30)"
          sleep 2
        done

    - name: Import database schema
      env:
        MYSQL_PWD: ""
      run: |
        mysql -h127.0.0.1 -P3306 -uroot upchar_live < database/upchar_live.sql

    - name: Run basic PHP syntax check
      run: find . -name "*.php" -exec php -l {} \; | grep -v "No syntax errors detected"

    - name: Test database connection
      env:
        MYSQL_PWD: ""
      run: |
        php -r "
        $mysqli = new mysqli('127.0.0.1', 'root', '', 'upchar_live', 3306);
        if ($mysqli->connect_error) {
            echo 'Connection failed: ' . $mysqli->connect_error;
            exit(1);
        }
        echo 'Database connection successful';
        $mysqli->close();
        "